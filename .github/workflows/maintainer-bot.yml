# Builds the launcher APK in the cloud so you don't need Android Studio.
#
#   - Every push to main, and every manual run, produces an APK you can download
#     from the run page (Actions tab -> the run -> Artifacts -> vibe-launcher-apk).
#   - Pushing a tag that starts with "v" (for example v0.1.0) also publishes the
#     APK on the repository's Releases page.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Every successful build on main replaces the APK on the "latest" release, so the
  # download is a plain app-debug.apk (no zip): Releases page -> Latest build -> app-debug.apk
  publish-latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibe-launcher-apk

      - name: Create or update the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Latest build" --prerelease \
              --notes "Automatic build of the newest code on main. Download app-debug.apk below."
          gh release upload latest app-debug.apk --repo "$GITHUB_REPOSITORY" --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibe-launcher-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" app-debug.apk --repo "$GITHUB_REPOSITORY" --generate-notes
